[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-credential-types = "1.3.1"
aws-sdk-cognitoidentityprovider = "1.143.0"
aws-sdk-dynamodb = "1.130.0"
aws-sdk-s3 = "1.152.0"
aws-sdk-sesv2 = "1.144.0"
aws-sdk-ssm = "1.132.0"
aws-sigv4 = "1.6.4"
aws-smithy-runtime-api = "1.19.2"
axum = { version = "0.8.9", features = ["json"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
futures = "0.3"
lambda_http = "1.3.1"
ptcore = { version = "0.1.0", path = "../core" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
web-push-native = "0.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
