[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.130.0"
aws-sdk-s3 = "1.152.0"
aws-sdk-sesv2 = "1.144.0"
axum = { version = "0.8.9", features = ["json"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3"
lambda_http = "1.3.1"
ptcore = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
