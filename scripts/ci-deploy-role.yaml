AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Deploy access for GitHub Actions (OIDC, no stored keys). Deploy once per
  AWS account and stage; see docs/DEPLOY.md ("Deploying from GitHub Actions").

  Three layers, so a compromised CI job cannot become an account admin:
  * GitHubDeployRole (assumed by CI) can only drive CloudFormation on this
    stage's stacks, upload artifacts and publish the web app. It touches no
    other service directly.
  * CfnExecRole (assumed by CloudFormation for the app stack) creates the
    resources. It may create IAM roles only if they carry the boundary.
  * AppBoundary caps any such role at the app's own table, buckets and
    logs, whatever policy the template attaches. Extend it when the app
    needs a new service (e.g. SQS for video in Phase 1b).

  scripts/deploy.sh derives these names from the account id when
  DEPLOY_ROLE_STACK=1, so keep them in sync if you rename anything.

Parameters:
  Repository:
    Type: String
    Default: angrysea/ptapp
    Description: GitHub owner/repo allowed to assume the CI role
  Environment:
    Type: String
    Default: dev
    Description: Stack stage, also the GitHub environment the deploy job runs in
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to false if this account already has the GitHub OIDC provider

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # sam deploy uploads the Lambda bundle and template here (instead of
  # --resolve-s3, which would need bucket-creation rights).
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ptapp-${Environment}-sam-artifacts-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 30

  AppBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ptapp-${Environment}-boundary
      Description: Ceiling for every role the app stack creates
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: dynamodb:*
            Resource:
              - !Sub arn:aws:dynamodb:*:${AWS::AccountId}:table/ptapp-${Environment}
              - !Sub arn:aws:dynamodb:*:${AWS::AccountId}:table/ptapp-${Environment}/*
          - Effect: Allow
            Action: s3:*
            Resource:
              - !Sub arn:aws:s3:::ptapp-${Environment}-*
              - !Sub arn:aws:s3:::ptapp-${Environment}-*/*
          - Effect: Allow
            Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/ptapp-${Environment}-*

  CfnExecRole:
    Type: AWS::IAM::Role
    Properties:
      # Outside the ptapp-<env>-* pattern below, so it cannot modify itself.
      RoleName: !Sub cfn-exec-ptapp-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      # CI can submit any template, so this role is the real ceiling of a CI
      # deploy. It covers only the services template.yaml uses, scoped to
      # this stage's names where the service allows it. Cognito, API Gateway
      # and CloudFront resources get generated ids, so they cannot be scoped
      # by name; a dedicated AWS account per stage closes that gap
      # (DEPLOY.md). Add services here (and to AppBoundary) as the app grows.
      Policies:
        - PolicyName: stack-services
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:*
                Resource:
                  - !Sub arn:aws:dynamodb:*:${AWS::AccountId}:table/ptapp-${Environment}
                  - !Sub arn:aws:dynamodb:*:${AWS::AccountId}:table/ptapp-${Environment}/*
              # Media and web buckets (CloudFormation names them
              # ptapp-<env>-<logicalid>-<random>) and the artifact bucket.
              - Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:aws:s3:::ptapp-${Environment}-*
                  - !Sub arn:aws:s3:::ptapp-${Environment}-*/*
              - Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:aws:lambda:*:${AWS::AccountId}:function:ptapp-${Environment}-*
              - Effect: Allow
                Action: logs:*
                Resource: !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/ptapp-${Environment}-*
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Effect: Allow
                Action: [cognito-idp:*, apigateway:*, cloudfront:*]
                Resource: "*"
        - PolicyName: bounded-stack-roles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Every action that supports the boundary condition requires it.
              # Trust-policy edits are not granted at all: the stack never
              # needs them, and they cannot be tied to the boundary.
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/ptapp-${Environment}-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref AppBoundary
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:DeleteRole
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/ptapp-${Environment}-*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/ptapp-${Environment}-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: "*"

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub github-deploy-ptapp-${Environment}
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Jobs in this GitHub environment only; DEPLOY.md restricts
                # the environment to the main branch.
                token.actions.githubusercontent.com:sub: !Sub repo:${Repository}:environment:${Environment}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudformation:*
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ptapp-${Environment}/*
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Effect: Allow
                Action: [cloudformation:GetTemplateSummary, cloudformation:ValidateTemplate]
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket, s3:GetBucketLocation]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
              # Publishing the PWA: the stack's web bucket and its CloudFront cache.
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub arn:aws:s3:::ptapp-${Environment}-webbucket-*
                  - !Sub arn:aws:s3:::ptapp-${Environment}-webbucket-*/*
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/*

Outputs:
  RoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN variable on the GitHub environment
    Value: !GetAtt GitHubDeployRole.Arn
  CfnExecRoleArn:
    Value: !GetAtt CfnExecRole.Arn
  BoundaryArn:
    Value: !Ref AppBoundary
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
