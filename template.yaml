AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Online personal training app - MVP (Rust Lambda + HTTP API + DynamoDB + Cognito + S3/CloudFront PWA)

Parameters:
  Stage:
    Type: String
    Default: dev
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique prefix for the Cognito hosted login domain (e.g. myptapp-dev)
  LocalDevOrigin:
    Type: String
    Default: http://localhost:8080
    Description: Extra origin allowed for CORS and OAuth callbacks while developing the web app locally
  VideoRetentionDays:
    Type: Number
    Default: 180
    MinValue: 1
    Description: Days after upload that set videos are deleted once a coach has reviewed them (unreviewed videos are kept)
  AdminEmails:
    Type: String
    Default: ""
    Description: Comma-separated emails that may set up an admin account (admins onboard coaches; there is no open coach signup)
  InviteFromAddress:
    Type: String
    Default: ""
    Description: Sender for invitation emails, e.g. invites@gymtxcoach.com. Its domain becomes an SES identity (add the DkimRecord outputs to its DNS). Empty turns emailing off.
  CreateSenderIdentity:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: '"false" when the sender domain is already an SES identity in this account and region (e.g. created in the console); the stack then uses it as is'
  AppDomain:
    Type: String
    Default: ""
    Description: The app's own domain, e.g. gymtxcoach.com (www.<domain> redirects to it). Empty serves the app at the CloudFront address only.
  AppCertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate in us-east-1 covering AppDomain and www.AppDomain (CloudFront only uses us-east-1 certificates). Required with AppDomain.
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:acm:us-east-1:\d{12}:certificate/.+$'
    ConstraintDescription: empty, or an ACM certificate ARN in us-east-1

Conditions:
  HasAppDomain: !Not [!Equals [!Ref AppDomain, ""]]
  SendsInvites: !Not [!Equals [!Ref InviteFromAddress, ""]]
  CreatesSenderIdentity: !And [!Condition SendsInvites, !Equals [!Ref CreateSenderIdentity, "true"]]

Globals:
  Function:
    Runtime: provided.al2023
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10

Resources:
  # ------------------------------------------------------------------ data
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ptapp-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT]
            AllowedOrigins: [!Sub "https://${Distribution.DomainName}", !Ref LocalDevOrigin, !If [HasAppDomain, !Sub "https://${AppDomain}", !Ref AWS::NoValue]]
            AllowedHeaders: ["*"]
            # Video uploads read each part's ETag to complete the multipart upload.
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 2 }
          # Uploads are tagged state=pending until the API confirms them
          # (util::PENDING_TAG); anything never confirmed is removed.
          - Id: expire-unconfirmed-uploads
            Status: Enabled
            TagFilters: [{ Key: state, Value: pending }]
            ExpirationInDays: 2
          # Marking a set video reviewed tags it reviewed=true (routes/videos.rs).
          - Id: expire-reviewed-set-videos
            Status: Enabled
            TagFilters: [{ Key: reviewed, Value: "true" }]
            ExpirationInDays: !Ref VideoRetentionDays

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt MediaBucket.Arn, !Sub "${MediaBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  # ------------------------------------------------------------------ auth
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ptapp-${Stage}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool
      # 2 = managed login (the successor to the classic hosted UI, version 1).
      ManagedLoginVersion: 2

  # The invitation sender's domain, signed with Easy DKIM. Sending works once
  # the three CNAMEs in the DkimRecord outputs are in the domain's DNS, and to
  # any address once the account has SES production access.
  InviteSenderDomain:
    Type: AWS::SES::EmailIdentity
    Condition: CreatesSenderIdentity
    Properties:
      EmailIdentity: !Select [1, !Split ["@", !Ref InviteFromAddress]]
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT

  # Managed login shows nothing for an app client until it has a branding
  # style; Cognito's defaults are enough for now.
  LoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub "https://${Distribution.DomainName}/", !Sub "${LocalDevOrigin}/", !If [HasAppDomain, !Sub "https://${AppDomain}/", !Ref AWS::NoValue]]
      LogoutURLs: [!Sub "https://${Distribution.DomainName}/", !Sub "${LocalDevOrigin}/", !If [HasAppDomain, !Sub "https://${AppDomain}/", !Ref AWS::NoValue]]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_SRP_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { IdToken: minutes, AccessToken: minutes, RefreshToken: days }

  # ------------------------------------------------------------------ api
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      CorsConfiguration:
        AllowOrigins: [!Sub "https://${Distribution.DomainName}", !Ref LocalDevOrigin, !If [HasAppDomain, !Sub "https://${AppDomain}", !Ref AWS::NoValue]]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ptapp-${Stage}-api
      # Built by `cargo lambda build --release --arm64 --bin api` (see scripts/deploy.sh)
      CodeUri: target/lambda/api/
      Handler: bootstrap
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          MEDIA_BUCKET: !Ref MediaBucket
          ADMIN_EMAILS: !Ref AdminEmails
          INVITE_FROM: !Ref InviteFromAddress
          APP_URL: !If [HasAppDomain, !Sub "https://${AppDomain}", !Sub "https://${Distribution.DomainName}"]
          VIDEO_RETENTION_DAYS: !Ref VideoRetentionDays
          RUST_LOG: info
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref MediaBucket }
        # Presigned uploads carry a pending tag, confirming removes it, and
        # reviewed videos are tagged for retention. Clients can abandon a
        # video mid-upload.
        - Statement:
            - Effect: Allow
              Action: [s3:PutObjectTagging, s3:DeleteObjectTagging, s3:AbortMultipartUpload]
              Resource: !Sub "${MediaBucket.Arn}/*"
        # Invitation emails (mail.rs), from this account's SES identities.
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
            Auth: { Authorizer: NONE }
        # Browsers send a CORS preflight (OPTIONS, never with a token) before
        # every authorized call. The ANY route above would put it through the
        # JWT authorizer and fail it with 401, so preflights get their own
        # unauthenticated route; the Lambda's CORS layer answers them.
        Preflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: OPTIONS
            Auth: { Authorizer: NONE }
        # The sign-up page reads an invitation (to fill in its email) before
        # the person has an account; the code itself is the secret.
        PublicInvite:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /invites/{code}/public
            Method: GET
            Auth: { Authorizer: NONE }

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ptapp-${Stage}-api
      RetentionInDays: 30

  # ------------------------------------------------------------------ web
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  WebOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ptapp-${Stage}-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      cfn-lint:
        config:
          # AppCertificateArn's empty default is only used when AppDomain is empty,
          # which leaves ViewerCertificate out.
          ignore_checks: [W1030]
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Aliases: !If [HasAppDomain, [!Ref AppDomain, !Sub "www.${AppDomain}"], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasAppDomain
          - AcmCertificateArn: !Ref AppCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref AWS::NoValue
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOac
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations: !If
            - HasAppDomain
            - [{ EventType: viewer-request, FunctionARN: !GetAtt WwwRedirect.FunctionMetadata.FunctionARN }]
            - !Ref AWS::NoValue

  # www.<AppDomain> → <AppDomain>, keeping the path and query.
  WwwRedirect:
    Type: AWS::CloudFront::Function
    Condition: HasAppDomain
    Properties:
      Name: !Sub ptapp-${Stage}-www-redirect
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www to the bare domain
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var r = event.request;
          if (r.headers.host && r.headers.host.value.indexOf('www.') === 0) {
            var qs = Object.keys(r.querystring).map(function (k) { return k + '=' + r.querystring[k].value; }).join('&');
            return { statusCode: 301, statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://${AppDomain}' + r.uri + (qs ? '?' + qs : '') } } };
          }
          return r;
        }

Outputs:
  AppUrl:
    Value: !If [HasAppDomain, !Sub "https://${AppDomain}", !Sub "https://${Distribution.DomainName}"]
  CloudFrontDomain:
    Description: Point the app's domain (and www) at this with a CNAME, DNS only
    Value: !GetAtt Distribution.DomainName
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  CognitoDomain:
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  WebBucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref Distribution
  TableName:
    Value: !Ref Table
  MediaBucketName:
    Value: !Ref MediaBucket
  # Add these three CNAME records to the sender domain's DNS so SES can send
  # invitations from it (each value is "name -> target").
  DkimRecord1:
    Condition: CreatesSenderIdentity
    Value: !Sub "${InviteSenderDomain.DkimDNSTokenName1} CNAME ${InviteSenderDomain.DkimDNSTokenValue1}"
  DkimRecord2:
    Condition: CreatesSenderIdentity
    Value: !Sub "${InviteSenderDomain.DkimDNSTokenName2} CNAME ${InviteSenderDomain.DkimDNSTokenValue2}"
  DkimRecord3:
    Condition: CreatesSenderIdentity
    Value: !Sub "${InviteSenderDomain.DkimDNSTokenName3} CNAME ${InviteSenderDomain.DkimDNSTokenValue3}"
